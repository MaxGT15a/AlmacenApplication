<h2 mat-dialog-title>{{ esEdicion ? 'Editar' : 'Nuevo' }} producto</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
      <mat-error *ngIf="form.get('nombre')?.hasError('required')">El nombre es requerido</mat-error>
      <mat-error *ngIf="form.get('nombre')?.hasError('minlength') || form.get('nombre')?.hasError('maxlength')">
        El nombre debe tener entre 5 y 30 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Categoría</mat-label>
      <mat-select formControlName="categoria">
        <mat-option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('categoria')?.hasError('required')">La categoría es requerida</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Precio</mat-label>
      <input matInput type="number" formControlName="precio">
      <mat-error *ngIf="form.get('precio')?.hasError('required')">El precio es requerido</mat-error>
      <mat-error *ngIf="form.get('precio')?.hasError('min')">El precio debe ser positivo</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" formControlName="cantidad">
      <mat-error *ngIf="form.get('cantidad')?.hasError('required')">La cantidad es requerida</mat-error>
      <mat-error *ngIf="form.get('cantidad')?.hasError('min')">La cantidad debe ser positiva</mat-error>
    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="guardando">
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
  </mat-dialog-actions>
</form>
